[project]
name = "reelvault-server"
version = "0.2.0"
description = "ReelVault AI API — FastAPI + Supabase + Gemini"
readme = "readme.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2",
    "pydantic-settings>=2",
    "supabase>=2.9",
    "httpx>=0.27",
    "tenacity>=8.5",
    "tavily-python>=0.5",
    "langchain>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "langchain-google-genai==2.1.12",
    "google-api-core==2.40.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]